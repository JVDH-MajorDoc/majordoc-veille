# MajorDoc — served by nginx (CT Proxmox / VPS)
# /etc/nginx/sites-available/majordoc  →  ln -s ../sites-available/majordoc /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name veille.example.org;          # ← votre domaine

    root /opt/majordoc/site;
    index index.html;
    charset utf-8;

    # Les ressources versionnées : cache long
    location ~* \.(woff2|css|js|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Les données changent tous les matins : jamais de cache
    location /data/ {
        add_header Cache-Control "no-cache, must-revalidate";
        types { application/json json; }
        default_type application/json;
    }

    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ =404; }
}

# Après avoir vérifié que le site répond en HTTP :
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d veille.example.org
