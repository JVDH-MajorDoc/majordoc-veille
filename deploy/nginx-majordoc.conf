# MajorDoc — served by nginx (CT Proxmox / VPS)
# /etc/nginx/sites-available/majordoc  →  ln -s ../sites-available/majordoc /etc/nginx/sites-enabled/
#
# Attention à une règle de nginx qui piège tout le monde : dès qu'un bloc
# `location` déclare un add_header, il n'hérite PLUS d'aucun add_header du
# niveau serveur. Les en-têtes de sécurité sont donc dans un fichier inclus
# par chaque bloc — c'est la seule façon de les avoir partout.
server {
    listen 80;
    listen [::]:80;
    server_name veille.example.org;          # ← votre domaine

    root /opt/majordoc/site;
    index index.html;
    charset utf-8;

    # La page elle-même : toujours revalidée. Sans cela, Safari peut garder
    # une ancienne page qui pointe vers d'anciens app.js / app.css.
    location = /index.html {
        include /etc/nginx/snippets/majordoc-securite.conf;
        add_header Cache-Control "no-cache";
    }

    # Les ressources sont versionnées par empreinte (app.js?v=…) : cache long.
    location ~* \.(woff2|css|js|svg|png)$ {
        include /etc/nginx/snippets/majordoc-securite.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Les données changent tous les matins : jamais de cache. Les fichiers
    # audio de la lecture vocale vivent aussi ici (data/audio/*.mp3) : le type
    # audio/mpeg doit être déclaré, sinon Safari refuse de les lire.
    location /data/ {
        include /etc/nginx/snippets/majordoc-securite.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        types {
            application/json json;
            audio/mpeg       mp3;
        }
        default_type application/octet-stream;
    }

    location / {
        include /etc/nginx/snippets/majordoc-securite.conf;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# Les en-têtes de sécurité : deploy/nginx-majordoc-securite.conf, à copier dans
# /etc/nginx/snippets/majordoc-securite.conf AVANT `nginx -t`.

# Après avoir vérifié que le site répond en HTTP :
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d veille.example.org
