# MajorDoc — en-têtes de sécurité, inclus par chaque bloc location du site.
# À copier dans /etc/nginx/snippets/majordoc-securite.conf (cf. INSTALLATION.md, §8).
#
# 'unsafe-inline' reste nécessaire : la page porte un petit script en tête
# (thème avant peinture, sans flash blanc) et quelques styles en ligne. Tout
# le reste est restreint au site lui-même : aucune ressource tierce n'est
# chargée, et le board ne peut être encadré par aucune autre page.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

# Une fois HTTPS en place et vérifié (§9), décommenter. Pas avant : un navigateur
# qui a vu cet en-tête refuse ensuite le site en HTTP pendant six mois.
# add_header Strict-Transport-Security "max-age=15552000" always;
