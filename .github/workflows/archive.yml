name: Archive de mise à jour

# Publie majordoc-maj-AAAA-MM-JJ.zip dans les Releases du dépôt, prête pour
# deploy/mettre-a-jour.sh. Deux façons de la déclencher :
#
#   · depuis GitHub : onglet Actions → « Archive de mise à jour » → Run workflow
#     (la date du jour par défaut) ;
#   · en ligne de commande : git tag maj-2026-10-01 && git push origin maj-2026-10-01
#
# L'archive n'est construite que si les tests passent : une version cassée ne
# doit pas pouvoir atterrir sur le serveur du cabinet.

on:
  push:
    tags: ['maj-*']
  workflow_dispatch:
    inputs:
      date:
        description: "Date de la mise à jour (AAAA-MM-JJ, ou AAAA-MM-JJ-2 pour une seconde le même jour) — vide : aujourd'hui"
        required: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Tests
        run: npm test

      - name: Construction de l'archive
        env:
          DATE_DEMANDEE: ${{ inputs.date }}
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            JOUR="${GITHUB_REF_NAME#maj-}"
          else
            JOUR="${DATE_DEMANDEE:-$(date -u +%F)}"
          fi
          # Un suffixe permet une seconde archive le même jour : 2026-10-01-2.
          echo "$JOUR" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$' || { echo "Date invalide : $JOUR" >&2; exit 1; }
          ARCHIVE="majordoc-maj-$JOUR.zip"
          git archive --format=zip --prefix=majordoc/ -o "$ARCHIVE" HEAD
          unzip -l "$ARCHIVE" | tail -1
          { echo "ARCHIVE=$ARCHIVE"; echo "JOUR=$JOUR"; } >> "$GITHUB_ENV"

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "maj-$JOUR" "$ARCHIVE" --target "$GITHUB_SHA" \
            --title "Mise à jour du $JOUR" \
            --notes "Archive prête pour deploy/mettre-a-jour.sh (INSTALLATION.md, section 15)."
